<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bikash Dhakal — Full Stack & DevOps Engineer building, containerising and shipping reliable web applications." />
    <meta name="theme-color" content="#09090b" />
    <meta property="og:title" content="Bikash Dhakal — Full Stack & DevOps Engineer" />
    <meta property="og:description" content="Full Stack & DevOps Engineer building, containerising and shipping reliable web applications." />
    <meta property="og:type" content="website" />
    <title>Bikash Dhakal — Full Stack & DevOps Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking web fonts: text renders instantly in system fonts, then swaps -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Inter+Tight:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Inter+Tight:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
    <script>
      // Apply the saved theme before first paint to avoid a colour flash
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
